xt-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit; width: 100%; background: #177A45; color: #FFFFFF; border: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"></path><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"></path></svg><span>ابعت الكل</span></button></div><div style="display: flex; flex-direction: column; gap: 8px;"><sc-for list="{{rows}}" as="r" hint-placeholder-count="7"><div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E4DFD5; border-radius: 16px; padding: 12px; {{r.rowStyle}}"><span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex-shrink: 0; {{r.avStyle}}">{{r.initial}}</span><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 16px; font-weight: 600;">{{r.name}}</span><span style="font-size: 13px; {{r.subStyle}}">{{r.sub}}</span><span style="font-size: 15px; font-weight: 700;">{{r.amt}} <span style="font-size: 0.75em; font-weight: 500;">ج.م</span></span></div><sc-if value="{{r.pending}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{r.send}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 14px; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit;  background: #177A45; color: #FFFFFF; border: none; padding: 0 12px; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"></path> "flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; text-decoration: none; color: #5E6A67; font-size: 12px; font-weight: 500;"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E6A67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"></path><path d="M16 4.1a4 4 0 0 1 0 7.8M22 21c0-3-1.8-5.6-4.5-6.6"></path></svg></span><span>العملاء</span></a><a href="Confirmations.dc.html" style="flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; text-decoration: none; color: #5E6A67; font-size: 12px; font-weight: 500;"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E6A67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></span><span>التأكيدات</span><span style="position: absolute; top: 4px; left: 22px; min-width: 18px; height: 18px; border-radius: 9px; background: #A8231B; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box;">3</span></a><a href="Report.dc.html" style="flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; text-decoration: none; color: #5E6A67; font-size: 12px; font-weight: 500;"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E6A67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M3 21h18"></path><path d="M6 17v-6M11 17V6M16 17v-9M21 17v-3"></path></svg></span><span>التقارير</span></a></nav></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 375, "height": 1040}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: {} }; }
  renderVals() {
    const AV = [['#E2EEEB','#0F5E56'],['#F6ECD8','#8A5300'],['#E4ECF7','#2A578F'],['#F3E3EC','#8A2F5E'],['#E8E6F4','#4B3F8F']];
    const data = [{"name": "سارة عادل", "sub": "قبل الميعاد بـ 3 أيام", "amt": "450", "k": "soon", "i": 0}, {"name": "هبة مصطفى", "sub": "قبل الميعاد بـ 3 أيام", "amt": "450", "k": "soon", "i": 1}, {"name": "مصطفى جمال", "sub": "قبل الميعاد بـ 3 أيام", "amt": "450", "k": "soon", "i": 2}, {"name": "دينا أشرف", "sub": "تيشيرت · ميعاده النهارده", "amt": "150", "k": "soon", "i": 3}, {"name": "محمود حسن", "sub": "متأخر 3 أيام", "amt": "450", "k": "late", "i": 4}, {"name": "كريم فتحي", "sub": "متأخر 3 أيام", "amt": "900", "k": "late", "i": 5}, {"name": "عمر خالد", "sub": "كامب الصيف · متأخر 3 أيام", "amt": "1,200", "k": "late", "i": 6}];
    const sent = this.state.sent;
    const n = data.filter(d => sent[d.i]).length;
    return {
      rows: data.map(d => ({
        name: d.name, sub: d.sub, amt: d.amt, initial: d.name[0],
        avStyle: 'background: ' + AV[d.i % 5][0] + '; color: ' + AV[d.i % 5][1] + ';',
        subStyle: d.k === 'late' ? 'color: #A8231B; font-weight: 600;' : 'color: #8A5300; font-weight: 600;',
        rowStyle: sent[d.i] ? 'background: #F2F8F4;' : '',
        sent: !!sent[d.i], pending: !sent[d.i],
        send: () => this.setState({ sent: Object.assign({}, sent, { [d.i]: true }) })
      })),
      sentCount: n, remain: n === 7 ? 'خلصنا النهارده' : 'فاضل ' + (7 - n),
      pct: Math.round(n / 7 * 100) + '%',
      sendAll: () => { const s = {}; data.forEach(d => { s[d.i] = true; }); this.setState({ sent: s }); }
    };
  }
}
</script>
