<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 375, "height": 1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all' }; }
  renderVals() {
    const CH = { paid: ['مدفوع', '#1B6B43', '#E2F1E8'], soon: ['مستحق قريب', '#8A5300', '#FBEFD6'], late: ['متأخر', '#A8231B', '#FBE4E1'], wait: ['في انتظار التأكيد', '#2A578F', '#E4ECF7'] };
    const AV = [['#E2EEEB','#0F5E56'],['#F6ECD8','#8A5300'],['#E4ECF7','#2A578F'],['#F3E3EC','#8A2F5E'],['#E8E6F4','#4B3F8F']];
    const data = [{"name": "محمود حسن", "sub": "اشتراك شهري · 20 في الشهر", "amt": "450", "k": "late", "i": 0}, {"name": "سارة عادل", "sub": "اشتراك شهري · 26 في الشهر", "amt": "450", "k": "soon", "i": 1}, {"name": "كريم فتحي", "sub": "اشتراك شهري · ولدين", "amt": "900", "k": "late", "i": 2}, {"name": "أحمد السيد", "sub": "اشتراك شهري · ولدين", "amt": "600", "k": "wait", "i": 3}, {"name": "منى إبراهيم", "sub": "اشتراك شهري", "amt": "450", "k": "paid", "i": 4}, {"name": "عمر خالد", "sub": "كامب الصيف", "amt": "1,200", "k": "late", "i": 5}, {"name": "هبة مصطفى", "sub": "اشتراك شهري · 26 في الشهر", "amt": "450", "k": "soon", "i": 6}, {"name": "ياسمين طارق", "sub": "اشتراك شهري", "amt": "450", "k": "paid", "i": 7}, {"name": "يوسف رمضان", "sub": "اشتراك أغسطس", "amt": "300", "k": "late", "i": 8}, {"name": "نورهان سامي", "sub": "اشتراك شهري · 3 إخوات", "amt": "750", "k": "paid", "i": 9}, {"name": "دينا أشرف", "sub": "تيشيرت الأكاديمية", "amt": "150", "k": "soon", "i": 10}];
    const F = [['all', 'الكل 68'], ['late', 'متأخر 4'], ['soon', 'قريب 5'], ['wait', 'مستني تأكيد 3'], ['paid', 'مدفوع 56']];
    const f = this.state.f;
    return {
      filters: F.map(([k, l]) => ({ label: l, on: f === k, pick: () => this.setState({ f: k }),
        style: f === k ? 'background: #1C2B2A; color: #FFFFFF; border: 1.5px solid #1C2B2A;' : 'background: #FFFFFF; color: #1C2B2A; border: 1.5px solid #D6D0C4;' })),
      rows: data.filter(d => f === 'all' || d.k === f).map(d => ({ name: d.name, sub: d.sub, amt: d.amt, initial: d.name[0],
        avStyle: 'background: ' + AV[d.i % 5][0] + '; color: ' + AV[d.i % 5][1] + ';',
        chip: CH[d.k][0], chipStyle: 'color: ' + CH[d.k][1] + '; background: ' + CH[d.k][2] + ';' }))
    };
  }
}
</script>
