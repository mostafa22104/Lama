<div dir="rtl" style="margin: 0 auto; width: 375px; height: 1000px; display: flex; flex-direction: column; background: #F6F4EF; color: #1C2B2A; font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif; overflow: hidden; box-sizing: border-box; position: relative;"><div style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 8px;"><div style="width: 52px; height: 52px; border-radius: 13px; background: #F6ECD8; color: #B7791F; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; flex-shrink: 0; border: 1.5px solid #E9D3A6;">ن</div><div style="display: flex; flex-direction: column;"><span style="font-size: 18px; font-weight: 700;">أكاديمية النجوم للكرة</span><span style="font-size: 13px; color: #5E6A67;">التجمع الخامس، القاهرة</span></div></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 16px 24px; box-sizing: border-box; overflow: hidden;"><div style="background: #FFFFFF; border: 1px solid #E4DFD5; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 17px;">أهلاً <b>محمود حسن</b></span><span style="font-size: 15px; color: #5E6A67;">اشتراك سبتمبر 2026 · يوسف</span><div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 40px; white-space: nowrap; font-weight: 700;">450 <span style="font-size: 0.7em; font-weight: 500;">ج.م</span></span><span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FBE4E1; color: #A8231B; white-space: nowrap; line-height: 1.5;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #A8231B; flex-shrink: 0;"></span>متأخر</span></div><span style="font-size: 13px; color: #A8231B;">كان ميعاده 20 سبتمبر</span></div><div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 15px; font-weight: 600;">1. حوّل على العنوان ده</span><div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1.5px dashed #0F5E56; border-radius: 14px; padding: 6px 6px 6px 6px;"><span dir="ltr" style="flex-grow: 1; font-size: 16px; font-weight: 700; text-align: right; padding: 0 10px; overflow: hidden; text-overflow: ellipsis;">nogoum.academy@instapay</span><button type="button" onClick="{{copy}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 14px; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit;  background: #0F5E56; color: #FFFFFF; border: none; padding: 0 14px; gap: 6px; background: {{copyBg}};"><sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg></sc-if><sc-if value="{{copied}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m5 12 5 5 9-10"></path></svg></sc-if><span>{{copyLabel}}</span></button></div><button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit; width: 100%; background: #FFFFFF; color: #0F5E56; border: 1.5px solid #0F5E56;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M14 3h7v7M21 3l-9 9"></path><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path></svg><span>افتح InstaPay</span></button></div><div style="display: flex; flex-direction: column; gap: 10px;"><span style="font-size: 15px; font-weight: 600;">2. بعد ما تحوّل</span><a href="UploadProof.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; padding: 0 20px; border-radius: 14px; font-size: 20px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit; width: 100%; background: #0F5E56; color: #FFFFFF; border: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m5 12 5 5 9-10"></path></svg><span>دفعت</span></a><sc-if value="{{noSheet}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{openSheet}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit; width: 100%; background: transparent; color: #0F5E56; border: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span>هدفع يوم…</span></button></sc-if><sc-if value="{{sheet}}" hint-placeholder-val="{{false}}"><div style="background: #FFFFFF; border: 1px solid #E4DFD5; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;"><span style="font-size: 16px; font-weight: 700;">هتدفع إمتى؟</span><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;"><sc-for list="{{days}}" as="d" hint-placeholder-count="4"><button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="height: 64px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; {{d.style}}"><span style="font-size: 12px;">{{d.wd}}</span><span style="font-size: 18px; font-weight: 700;">{{d.n}}</span></button></sc-for></div><button type="button" onClick="{{confirmLater}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 20px; border-radius: 14px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-sizing: border-box; font-family: inherit; width: 100%; background: #0F5E56; color: #FFFFFF; border: none;">تمام</button></div></sc-if><sc-if value="{{promised}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 10px; background: #E4ECF7; color: #2A578F; border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>{{promiseText}}</span></div></sc-if></div><div style="flex-grow: 1;"></div><div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #5E6A67; padding-top: 4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg><span>الفلوس بتروح للأكاديمية على طول · بواسطة</span><div style="display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true" style="flex-shrink: 0;"><rect width="32" height="32" rx="9" fill="#0F5E56"></rect><circle cx="16" cy="16" r="7.5" fill="none" stroke="#F3D9A4" stroke-width="2.6"></circle><circle cx="16" cy="16" r="2.6" fill="#F3D9A4"></circle></svg><span style="font-size: 13px; font-weight: 700; color: #5E6A67;">لَمّة</span></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 375, "height": 1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { copied: false, sheet: false, day: 25, promised: false }; }
  renderVals() {
    const s = this.state;
    const D = [[24, 'الخميس'], [25, 'الجمعة'], [26, 'السبت'], [27, 'الأحد']];
    const wd = (D.find(d => d[0] === s.day) || D[1])[1];
    return {
      copy: () => this.setState({ copied: true }), copied: s.copied, notCopied: !s.copied,
      copyLabel: s.copied ? 'اتنسخ' : 'انسخ', copyBg: s.copied ? '#1B6B43' : '#0F5E56',
      sheet: s.sheet, noSheet: !s.sheet && !s.promised, promised: s.promised,
      openSheet: () => this.setState({ sheet: true }),
      days: D.map(([n, w]) => ({ n, wd: w, on: s.day === n, pick: () => this.setState({ day: n }),
        style: s.day === n ? 'background: #0F5E56; color: #FFFFFF; border: none;' : 'background: #FFFFFF; color: #1C2B2A; border: 1.5px solid #D6D0C4;' })),
      confirmLater: () => this.setState({ sheet: false, promised: true }),
      promiseText: 'تمام، هنفكّرك يوم ' + wd + ' ' + s.day + ' سبتمبر'
    };
  }
}
</script>
</body>
</html>
